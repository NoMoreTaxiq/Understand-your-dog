name: Install reviews
on:
  push:
    paths:
      - 'reviews.js'
      - '.github/workflows/install-reviews.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert reviews loader before homepage script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="/reviews.js"></script>'
          if tag not in s:
              needle="<script>document.getElementById('year')"
              if needle not in s:
                  raise SystemExit('Homepage script marker not found')
              s=s.replace(needle,tag+needle,1)
              p.write_text(s)
          PY
      - name: Commit homepage change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load complete customer review bank'
          git push
