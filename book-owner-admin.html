<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Owner Requests | Andrew Admin</title><style>body{font:16px/1.5 Arial,sans-serif;background:#fff7e9;color:#211c15;margin:0}.wrap{max-width:1050px;margin:auto;padding:30px 5vw}h1{font-size:36px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}input,button{font:inherit;padding:12px;border:1px solid #d6c6ad;border-radius:9px}input{flex:1;min-width:230px}button{background:#183126;color:white;cursor:pointer;font-weight:bold}.card{background:white;border:1px solid #e8d9bd;border-radius:16px;padding:20px;margin:15px 0}.meta{color:#675d4f}.actions{display:flex;gap:12px;margin-top:15px}.reject{background:#8c3926}.pending{color:#a45100;font-weight:bold}.approved{color:green}.rejected{color:#a12e20}#message{font-weight:bold}</style></head><body><div class="wrap"><a href="/">← Website</a><h1>Book owner's free session requests</h1><p>Review the Amazon purchase evidence before approving. Approval reserves the requested time in the existing calendar and emails the customer. A pending request does not hold the slot.</p><div class="toolbar"><input id="key" type="password" placeholder="Calendar admin password" autocomplete="off"><button id="load">Load requests</button></div><p id="message"></p><div id="list"></div></div><script>const API='https://hkbpkodggevyoxtllujf.supabase.co/functions/v1/book-owner-sessions';const el=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){el('message').textContent='Loading…';try{const r=await fetch(API+'?action=admin-list',{headers:{'x-admin-key':el('key').value},cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error);el('message').textContent=j.requests.length+' request(s)';el('list').innerHTML=j.requests.map(q=>'<article class="card"><b>'+esc(q.customer_name)+'</b> <span class="'+esc(q.status)+'">('+esc(q.status)+')</span><div class="meta">Requested: '+esc(new Date(q.requested_start).toLocaleString('en-GB',{timeZone:'Europe/London',dateStyle:'full',timeStyle:'short'}))+' UK time</div><p><b>Order:</b> '+esc(q.order_reference)+'<br><b>Email:</b> '+esc(q.email)+'<br><b>Phone:</b> '+esc(q.phone)+'<br><b>Dog:</b> '+esc(q.dog_name)+'<br><b>Help with:</b> '+esc(q.main_issue)+'</p>'+(q.status==='pending'?'<div class="actions"><button data-id="'+esc(q.id)+'" data-decision="approve">Verify & approve</button><button class="reject" data-id="'+esc(q.id)+'" data-decision="reject">Reject</button></div>':'')+'</article>').join('');}catch(e){el('message').textContent=e.message}}el('load').onclick=load;el('list').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;const decision=b.dataset.decision;if(!confirm(decision==='approve'?'Have you checked purchase proof? This will book the appointment and email the customer.':'Reject this request?'))return;b.disabled=true;el('message').textContent='Processing…';try{const r=await fetch(API+'?action=admin-review',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':el('key').value},body:JSON.stringify({id:b.dataset.id,decision})}),j=await r.json();if(!r.ok)throw Error(j.error);await load()}catch(err){el('message').textContent=err.message;b.disabled=false}};</script></body></html>
